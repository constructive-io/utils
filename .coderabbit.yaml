# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!yarn.lock"
    - "!**/dist/**"
    - "!**/__snapshots__/**"
    - "!packages/*/sql/**"
  path_instructions:
    - path: "packages/**/*.sql"
      instructions: >-
        Follow the README's extension-based deployment model. Review migration source changes with their deploy, revert and verify counterparts and preserve recursive dependency ordering; use the documented PostgreSQL testing tools for database behavior.
chat:
  art: false
